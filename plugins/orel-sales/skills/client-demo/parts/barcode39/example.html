<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>barcode39 · דוגמה</title>
<link rel="stylesheet" href="./barcode39.css">
<style>
  body { font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 0; padding: 16px; background: #eceae4; color: #1d1d1d; }
  main { max-inline-size: 620px; margin-inline: auto; display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .card { background: #fff; border: 1px solid #ccc; padding: 16px; display: grid; gap: 8px; }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; } .card dt { color: #666; } .card dd { margin: 0; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; } .bar input { min-block-size: 44px; font: inherit; padding-inline: 10px; border: 1px solid #999; border-radius: 6px; direction: ltr; }
  .bar button { min-block-size: 44px; padding-inline: 14px; font: inherit; border: 1px solid #444; border-radius: 6px; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>כרטיס עבודה — נגריית «שבבים» (עסק בדוי)</h1>
  <div class="card">
    <dl><dt>הזמנה</dt><dd>ארון מטבח, 3 חזיתות אלון</dd><dt>שלב</dt><dd>חיתוך ← הדבקת קנט ← צביעה ← הרכבה</dd></dl>
    <div id="bc"></div>
  </div>
  <div class="bar"><input id="code" value="SH-2603-0417" aria-label="מספר כרטיס"><button type="button" id="set">הפקת ברקוד</button></div>
</main>
<script type="module">
  import { mountBarcode } from "./barcode39.js";
  const bc = mountBarcode(document.getElementById("bc"), "SH-2603-0412", { height: 60 });
  document.getElementById("set").onclick = () => bc.set(document.getElementById("code").value);
</script>
<script type="application/json" id="verify">[{"countMin": ["#bc svg rect", 40]}, {"text": ["#bc", "SH-2603-0412"]}, {"click": "#set"}, {"text": ["#bc", "SH-2603-0417"]}]</script>
</body>
</html>
