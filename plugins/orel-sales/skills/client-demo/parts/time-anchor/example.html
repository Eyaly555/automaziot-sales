<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>time-anchor · דוגמה</title>
<style>
  body { font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 0; padding: 16px; background: #f5f6f8; color: #1d1d1d; }
  main { max-inline-size: 760px; margin-inline: auto; display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 0; } p { margin: 0; color: #555; }
  .clock { font-size: 40px; font-variant-numeric: tabular-nums; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  li { background: #fff; border: 1px solid #dde1e6; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; }
  button { min-block-size: 44px; padding-inline: 14px; font: inherit; border: 1px solid #556; border-radius: 8px; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>מרפאת הכלבים «זנב מכשכש» (עסק בדוי) — התורים</h1>
  <p>הזמן כאן מעוגן לתאריך של הנתונים, לא לשעון המחשב. בשבוע הבא הדמו ייראה בדיוק אותו דבר.</p>
  <div class="clock" id="clock"></div>
  <div class="bar"><button id="plus" type="button">+2 שעות</button><button id="fast" type="button">פי 60</button></div>
  <ul id="list"></ul>
</main>
<script type="module">
  import { createClock } from "./time-anchor.js";
  const c = createClock({ asOf: "2026-03-04T09:14:00" });
  c.mount(document.getElementById("clock"), (d) => `יום ${c.weekday(d)} · ${c.date(d)} · ${c.time(d)}`);
  const items = [
    ["בדיקה שנתית — לוקה", c.at(0, "08:40")], ["חיסון — באדי", c.at(0, "10:30")], ["ניתוח קטן — שוקו", c.at(-1, "13:15")],
    ["ביקורת — רקסי", c.at(-3, "11:00")], ["ייעוץ תזונה — פלפל", c.addWorkDays(c.at(0, "12:00"), 2)], ["צילום — טופי", c.at(-40, "09:00")],
  ];
  const paint = () => { document.getElementById("list").innerHTML = items.map(([w, d]) => `<li><span>${w}</span><b>${c.relative(d)}</b></li>`).join(""); };
  paint(); c.onTick(paint, 1000);
  document.getElementById("plus").addEventListener("click", () => { c.advance(2 * 36e5); paint(); });
  document.getElementById("fast").addEventListener("click", () => c.setRate(60));
</script>
<script type="application/json" id="verify">[{"text": ["#clock", "04/03/2026"]}, {"text": ["#list", "אתמול 13:15"]}, {"click": "#plus"}, {"changed": "#clock"}, {"text": ["#clock", "11:14"]}]</script>
</body>
</html>
